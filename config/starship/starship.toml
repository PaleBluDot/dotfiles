"$schema" = 'https://starship.rs/config-schema.json'

# color scheme
# yellow #cef542
# blue #0a63c9
# red #d40f51
# organge #db490b
# pink #c91e7a
# purple #9a348e
# green #417e37
# aqua #06969a
# teal #33658a

format = """
[](#cef542)\
$os\
[](fg:#cef542 bg:#0a63c9)\
$username\
[](fg:#0a63c9 bg:#c91e7a)\
$directory\
[](fg:#c91e7a bg:#9a348e)\
$git_branch\
$git_status\
[](fg:#9a348e bg:#417e37)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#417e37 bg:#06969a)\
$docker_context\
[](fg:#06969a bg:#33658a)\
$time\
[ ](fg:#33658a)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#cef542 fg:#151515"
format = "[ $symbol $path ]($style)"
disabled = false # Disabled by default

[os.symbols]
Arch = "󰣇"
Debian = ""
FreeBSD = ""
Linux = ""
Macos = ""
Windows = ""

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
# symbol = ""
style_user = "bg:#0a63c9"
style_root = "bg:#db490b"
format = '[ $user ]($style)'
disabled = false

[directory]
style = "bold bg:#c91e7a"
home_symbol = ""
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
# [directory.substitutions]
# "Documents" = "󰈙"
# "Downloads" = ""
# "Music" = ""
# "Pictures" = ""
# "aclu-emails" = "󱃜"

[git_branch]
symbol = "󰊢"
style = "bold bg:#9a348e"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bold bg:#9a348e"
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = ""
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = ""
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[elixir]
symbol = ""
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = ""
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = "󰟓"
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = "󰎙"
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥"
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = " bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bold bg:#417e37"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = "󰡨"
style = "bold bg:#06969a"
format = '[ $symbol $context ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bold bg:#33658a"
format = '[  $time ]($style)'
