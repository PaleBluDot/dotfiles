"$schema" = 'https://starship.rs/config-schema.json'

# Colours are named (bg:os, bg:user…) and come from the palette at the
# bottom of this file: one [palettes.<name>] per theme. Which one is used:
# on Omarchy, the current theme's (dotfiles writes a copy of this file with
# palette = "<theme>" to ~/.cache/starship/starship.toml on every theme
# change; STARSHIP_CONFIG points there); elsewhere, settings.theme in
# config.yml (default starburst). Setting an Omarchy theme with no palette
# here adds one, built from its colors.toml. Without the copy, palette below
# is used.
#
# Palette keys: os (first segment), os_text (its text), user, directory,
# git, language, docker, time, root (username when root).

# Must stay above the first [table]: TOML would put it inside that table.
palette = "starburst"

format = """
[](os)\
$os\
[](fg:os bg:user)\
$username\
[](fg:user bg:directory)\
${custom.directory}\
[](fg:directory bg:git)\
$git_branch\
$git_status\
[](fg:git bg:language)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:language bg:docker)\
$docker_context\
[](fg:docker bg:time)\
$time\
[ ](fg:time)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:os fg:os_text"
format = "[ $symbol $path ]($style)"
disabled = false # Disabled by default

[os.symbols]
Arch = "󰣇"
Debian = ""
FreeBSD = ""
Linux = ""
Macos = ""
Windows = ""

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
# symbol = ""
style_user = "bg:user"
style_root = "bg:root"
format = '[ $user ]($style)'
disabled = false

[directory]
style = "bold bg:directory"
# home_symbol = ""
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Replaces $directory in the format above. Inside a github.com/<org>/<repo>
# folder it shows the GitHub icon + repo name (plus any subfolder you're in).
# Everywhere else it shows a normal short path.
[custom.directory]
description = "GitHub icon + repo name inside github.com/<org>/<repo>, else the path"
when = true
shell = ["bash", "--noprofile", "--norc"]
command = '''
case "$PWD" in
  */github.com/*/*)
    rest=${PWD#*/github.com/}
    org=${rest%%/*}
    rest=${rest#*/}
    repo=${rest%%/*}
    sub=""
    if [ "$rest" != "$repo" ]; then
      sub="/${rest#*/}"
      # keep only the last 2 subfolders: /…/b/c
      if [ "$(printf '%s' "$sub" | tr -cd '/' | wc -c)" -gt 2 ]; then
        sub="/…/$(basename "$(dirname "$sub")")/$(basename "$sub")"
      fi
    fi
    # \357\220\210 is the GitHub icon (Nerd Font U+F408) as UTF-8 bytes.
    # No clickable link: starship can't mark OSC 8 links as zero-width for zsh,
    # which throws off the cursor position.
    printf '\357\220\210 %s%s' "$repo" "$sub"
    ;;
  *)
    path=${PWD/#$HOME/\~}
    # same as the directory module: last 3 folders, "…/" when cut
    if [ "$(printf '%s' "$path" | tr -cd '/' | wc -c)" -gt 3 ]; then
      path="…/$(printf '%s' "$path" | rev | cut -d/ -f1-3 | rev)"
    fi
    printf '󰉋 %s' "$path"
    ;;
esac
'''
style = "bold bg:directory"
format = "[ $output ]($style)"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
# [directory.substitutions]
# "Documents" = "󰈙"
# "Downloads" = ""
# "Music" = ""
# "Pictures" = ""
# "aclu-emails" = "󱃜"

[git_branch]
symbol = "󰊢"
style = "bold bg:git"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bold bg:git"
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = ""
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = ""
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[elixir]
symbol = ""
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = ""
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = "󰟓"
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = "󰎙"
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥"
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = " bold bg:language"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bold bg:language"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = "󰡨"
style = "bold bg:docker"
format = '[ $symbol $context ]($style)'

[time]
disabled = true
time_format = "%R"
style = "bold bg:time"
format = '[  $time ]($style)'

