"$schema" = 'https://starship.rs/config-schema.json'

# color scheme
# yellow #cef542
# blue #0a63c9
# red #d40f51
# organge #db490b
# pink #c91e7a
# purple #9a348e
# green #417e37
# aqua #06969a
# teal #33658a

format = """
[](#cef542)\
$os\
[](fg:#cef542 bg:#0a63c9)\
$username\
[](fg:#0a63c9 bg:#c91e7a)\
${custom.directory}\
[](fg:#c91e7a bg:#9a348e)\
$git_branch\
$git_status\
[](fg:#9a348e bg:#417e37)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#417e37 bg:#06969a)\
$docker_context\
[](fg:#06969a bg:#33658a)\
$time\
[ ](fg:#33658a)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#cef542 fg:#151515"
format = "[ $symbol $path ]($style)"
disabled = false # Disabled by default

[os.symbols]
Arch = "󰣇"
Debian = ""
FreeBSD = ""
Linux = ""
Macos = ""
Windows = ""

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
# symbol = ""
style_user = "bg:#0a63c9"
style_root = "bg:#db490b"
format = '[ $user ]($style)'
disabled = false

[directory]
style = "bold bg:#c91e7a"
# home_symbol = ""
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Replaces $directory in the format above. Inside a github.com/<org>/<repo>
# folder it shows the GitHub icon + repo name (plus any subfolder you're in).
# Everywhere else it shows a normal short path.
[custom.directory]
description = "GitHub icon + repo name inside github.com/<org>/<repo>, else the path"
when = true
shell = ["bash", "--noprofile", "--norc"]
command = '''
case "$PWD" in
  */github.com/*/*)
    rest=${PWD#*/github.com/}
    org=${rest%%/*}
    rest=${rest#*/}
    repo=${rest%%/*}
    sub=""
    if [ "$rest" != "$repo" ]; then
      sub="/${rest#*/}"
      # keep only the last 2 subfolders: /…/b/c
      if [ "$(printf '%s' "$sub" | tr -cd '/' | wc -c)" -gt 2 ]; then
        sub="/…/$(basename "$(dirname "$sub")")/$(basename "$sub")"
      fi
    fi
    # \357\220\210 is the GitHub icon (Nerd Font U+F408) as UTF-8 bytes.
    # No clickable link: starship can't mark OSC 8 links as zero-width for zsh,
    # which throws off the cursor position.
    printf '\357\220\210 %s%s' "$repo" "$sub"
    ;;
  *)
    path=${PWD/#$HOME/\~}
    # same as the directory module: last 3 folders, "…/" when cut
    if [ "$(printf '%s' "$path" | tr -cd '/' | wc -c)" -gt 3 ]; then
      path="…/$(printf '%s' "$path" | rev | cut -d/ -f1-3 | rev)"
    fi
    printf '󰉋 %s' "$path"
    ;;
esac
'''
style = "bold bg:#c91e7a"
format = "[ $output ]($style)"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
