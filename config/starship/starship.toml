"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#9A348E)\
$os\
$username\
[](bg:#d40f51 fg:#9A348E)\
$directory\
[](fg:#d40f51 bg:#417E37)\
$git_branch\
$git_status\
[](fg:#417E37 bg:#cef542)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#cef542 bg:#06969A)\
$docker_context\
[](fg:#06969A bg:#33658A)\
$time\
[ ](fg:#33658A)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#9A348E"
style_root = "bg:#9A348E"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#9A348E"
disabled = true # Disabled by default

[directory]
style = "bg:#d40f51"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#417E37"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#417E37"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#cef542 fg:#1a1a1a"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#33658A"
format = '[ ♥ $time ]($style)'
