# packages.yaml: the tools dotfiles.sh installs and links (plan.md Section 5).
#
# Each tool's key is its folder name in config/ (config/<tool>/).
#
#   enabled:        true/false, written back by install/uninstall/link/unlink
#   default:        settings for every OS
#   os.macos:       overrides for macOS
#   os.windows:     overrides for Windows
#   os.linux:       overrides for every Linux distro
#   os.linux.debian / .pacman / .fedora: overrides for one distro family
#
# Lookup order for a field, first match wins:
#   Linux:  os.linux.<distro> -> os.linux -> default
#   other:  os.<os> -> default
# Only write a field where it differs; everything else is inherited.
# The value "default" means: skip the tiers in between, use default's value.
#
# Fields:
#   check_cmd:       command that proves the tool is installed
#   package:         package name for the OS package manager
#   err_install_msg: shown in the summary when there's no package to install
#   links:           list of {src, dest}; src is relative to config/<tool>/
#                    ("." = the whole folder), dest is relative to $HOME

packages:
  fd:
    enabled: false
    default:
      check_cmd: fd
      package: fd
      links:
        - src: ignore
          dest: .config/fd/ignore
    os:
      linux:
        package: fd-find # Debian and Fedora call it fd-find
        pacman:
          package: default # Arch calls it fd: back to default
      windows:
        package: sharkdp.fd
        links:
          - src: ignore
            dest: AppData/Roaming/fd/ignore

  cspell:
    enabled: false
    default:
      check_cmd: cspell
      err_install_msg: "Not auto-installed — install manually: npm install -g cspell"
      links:
        - src: cspell.json
          dest: .config/cspell/cspell.json
    os:
      windows:
        links:
          - src: cspell.json
            dest: AppData/Roaming/cspell/cspell.json

  nvim:
    enabled: false
    default:
      check_cmd: nvim
      package: neovim
      links:
        - src: .
          dest: .config/nvim
    os:
      windows:
        package: Neovim.Neovim
        links:
          - src: .
            dest: AppData/Local/nvim
