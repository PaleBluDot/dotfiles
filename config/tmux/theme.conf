# ── Theme colors ─────────────────────────────────────────────────────────────
# Change these values to re-theme the whole tmux setup.
# This file is sourced from tmux.conf — don't source it directly.

set -g @tmux_color_bg "#1a1b26"
set -g @tmux_color_fg "#c0caf5"
set -g @tmux_color_accent "#d6f511"
set -g @tmux_color_muted "#565f89"
set -g @tmux_color_active "#9ece6a"