# ── Prefix key ──────────────────────────────────
# Default is Ctrl+b — many people remap to Ctrl+a
# Uncomment to change:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ── Theme ────────────────────────────────────────
source-file ~/.config/dotfiles/config/tmux/theme.conf

# ── General behavior ────────────────────────────
set -g history-limit 10000
set -g mouse on
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# ── macOS clipboard integration ─────────────────
set -g set-clipboard on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"


# ── Pane splitting ──────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %


# ── Pane navigation (vim-style) ─────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ── Pane resizing ───────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ── Window Navigation ───────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# ── Reload config ───────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf

# ── New window/pane in current directory ────────
bind c new-window -c "#{pane_current_path}"

# ── Status bar styling ──────────────────────────
set -g status-position top
set -g status-left-length 30

# ── True color support ──────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Apply theme colors ──────────────────────────
set -g status-style "bg=#{@tmux_color_bg},fg=#{@tmux_color_fg}"

setw -g window-status-current-style "bg=#{@tmux_color_accent},fg=#{@tmux_color_bg},bold"
setw -g window-status-current-format " #I:#W "

setw -g window-status-style "bg=#{@tmux_color_bg},fg=#{@tmux_color_muted}"
setw -g window-status-format "#I"

set -g pane-border-style "fg=#{@tmux_color_muted}"
set -g pane-active-border-style "fg=#{@tmux_color_accent}"

set -g status-left "#[fg=#{@tmux_color_fg},bold] #S #[bg=#{@tmux_color_bg}] "
set -g status-right "#[fg=#{@tmux_color_active}]%Y-%m-%d #[fg=#{@tmux_color_active}]%H:%M "

set -g message-style "bg=#{@tmux_color_accent},fg=#{@tmux_color_bg}"