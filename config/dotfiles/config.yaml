# dotfiles.sh config (plan.md Section 18)
# Repo: config/dotfiles/config.yaml, linked to ~/.config/dotfiles/config.yaml

# Script settings. Commented lines show the built-in default.
settings:
  # log_file: ~/.local/state/dotfiles/dotfiles.log
  # backup_suffix: .bak

# Installed by "dotfiles.sh default", nothing linked (for quick machines).
# A name that is also under packages: uses that entry's package names.
default: []

# The key is the config/ folder name. Add a manager (pacman, apt, dnf,
# brew, winget) where its package name differs from the key; "none" = not there.
#   command:  only when the command isn't the key (can also be per manager)
#   manual:   no package manager installs it; this message says how
#   links:    src is a path under config/, dest a path under $HOME;
#             add windows:/macos:/linux: when that OS needs another dest
#   enabled:  written by link (true) and unlink (false)
#   locked:   true = unlink removes the links but never the package
#   clone:    repos to git clone (repo, dest under $HOME) after linking, only
#             when missing; an existing clone is never touched
#   inject:   on a link: the file holds op:// references; dest gets a copy
#             filled in by op inject (owner-only) instead of a symlink
#   copy:     on a link: a system file. dest is a full path (/etc/..., /usr/...)
#             that gets a root-owned copy, never a symlink; $HOME and $USER in
#             the file are filled in for you. Linking the tool needs sudo.
#   enable:   on a copied systemd unit: systemctl enable --now it
#   os:       on a link: only use it on that OS (linux, macos, windows)
packages:
  bash:
    enabled: true
    locked: true
    winget: none
    links:
      - src: bash/.bashrc
        dest: .bashrc

  bat:
    enabled: true
    winget: sharkdp.bat
    command:
      apt: batcat
    links:
      - src: bat
        dest: .config/bat

  btop:
    enabled: true
    winget: aristocratos.btop4win
    links:
      - src: btop
        dest: .config/btop

  chromium-flags.conf:
    enabled: true
    pacman: chromium
    apt: chromium
    dnf: chromium
    brew: none
    winget: none
    command: chromium
    links:
      - src: chromium-flags.conf
        dest: .config/chromium-flags.conf

  cspell:
    enabled: true
    manual: "Not auto-installed. Install by hand: npm install -g cspell"
    links:
      - src: cspell
        dest: .config/cspell

  espanso:
    enabled: true
    manual: "AUR package: omarchy pkg aur add espanso-wayland"
    links:
      - src: espanso
        dest: .config/espanso

  fastfetch:
    enabled: true
    winget: Fastfetch-cli.Fastfetch
    links:
      - src: fastfetch
        dest: .config/fastfetch

  fd:
    enabled: false
    apt: fd-find
    dnf: fd-find
    winget: sharkdp.fd
    command:
      apt: fdfind
    links:
      - src: fd/ignore
        dest: .config/fd/ignore

  fontconfig:
    enabled: true
    winget: none
    command: fc-list
    links:
      - src: fontconfig
        dest: .config/fontconfig

  ghostty:
    enabled: true
    apt: none
    dnf: none
    winget: none
    links:
      - src: ghostty
        dest: .config/ghostty

  git:
    enabled: true
    locked: true
    winget: Git.Git
    links:
      - src: git
        dest: .config/git

  gh:
    enabled: true
    manual: "Installed by mise (see config/mise/config.toml)"
    links:
      - src: gh/config.yml
        dest: .config/gh/config.yml

  gobuster:
    enabled: true
    winget: none
    links:
      - src: gobuster
        dest: .config/gobuster

  hypr:
    enabled: true
    pacman: hyprland
    apt: none
    dnf: none
    brew: none
    winget: none
    command: Hyprland
    links:
      - src: hypr
        dest: .config/hypr

  hyprland-preview-share-picker:
    enabled: true
    apt: none
    dnf: none
    brew: none
    winget: none
    links:
      - src: hyprland-preview-share-picker
        dest: .config/hyprland-preview-share-picker

  lazygit:
    enabled: true
    dnf: none
    winget: JesseDuffield.lazygit
    links:
      - src: lazygit
        dest: .config/lazygit

  mise:
    enabled: true
    pacman: mise-bin
    apt: none
    dnf: none
    winget: jdx.mise
    links:
      - src: mise/config.toml
        dest: .config/mise/config.toml

  nano:
    enabled: true
    winget: GNU.Nano
    links:
      - src: nano
        dest: .config/nano

  nvim:
    enabled: true
    pacman: neovim
    apt: neovim
    dnf: neovim
    brew: neovim
    winget: Neovim.Neovim
    links:
      - src: nvim
        dest: .config/nvim

  npm:
    enabled: true
    manual: "Comes with Node.js, installed by mise"
    links:
      - src: npm
        dest: .config/npm

  omarchy:
    enabled: true
    apt: none
    dnf: none
    brew: none
    winget: none
    links:
      - src: omarchy
        dest: .config/omarchy

  ssh:
    enabled: true
    locked: true
    pacman: openssh
    apt: openssh-client
    dnf: openssh-clients
    brew: none
    winget: none
    links:
      - src: ssh/config
        dest: .ssh/config
        inject: true # holds op:// references; written filled-in, not linked

  starship:
    enabled: true
    dnf: none
    winget: Starship.Starship
    links:
      - src: starship
        dest: .config/starship

  thefuck:
    enabled: true
    winget: none
    links:
      - src: thefuck
        dest: .config/thefuck

  tmux:
    enabled: true
    winget: none
    links:
      - src: tmux
        dest: .config/tmux

  vim:
    enabled: true
    dnf: vim-enhanced
    winget: vim.vim
    links:
      - src: vim
        dest: .config/vim

  vscode:
    enabled: true
    pacman: visual-studio-code-bin
    apt: none
    dnf: none
    brew: visual-studio-code
    winget: Microsoft.VisualStudioCode
    command: code
    links:
      - src: vscode/settings.json
        dest: .config/Code/User/settings.json
        macos: Library/Application Support/Code/User/settings.json
        windows: AppData/Roaming/Code/User/settings.json

  wezterm:
    enabled: true
    apt: none
    dnf: none
    winget: wez.wezterm
    links:
      - src: wezterm
        dest: .config/wezterm

  xdg-terminals.list:
    enabled: true
    pacman: xdg-terminal-exec
    apt: xdg-terminal-exec
    dnf: xdg-terminal-exec
    brew: none
    winget: none
    command: xdg-terminal-exec
    links:
      - src: xdg-terminals.list
        dest: .config/xdg-terminals.list


  yazi:
    enabled: true
    apt: none
    dnf: none
    winget: sxyazi.yazi
    links:
      - src: yazi
        dest: .config/yazi

  zsh:
    enabled: true
    locked: true
    winget: none
    links:
      - src: zsh
        dest: .config/zsh
      - src: zsh/.zshenv
        dest: .zshenv
    clone:
      - repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: .config/zsh/oh-my-zsh
      - repo: https://github.com/zsh-users/zsh-autosuggestions.git
        dest: .config/zsh/oh-my-zsh/custom/plugins/zsh-autosuggestions
      - repo: https://github.com/zsh-users/zsh-completions.git
        dest: .config/zsh/oh-my-zsh/custom/plugins/zsh-completions
      - repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
        dest: .config/zsh/oh-my-zsh/custom/plugins/zsh-syntax-highlighting
