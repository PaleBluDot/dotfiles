# dotfiles.sh: every tool, what it installs, links and clones. Tool names
# match the folders in config/ and the scripts in config/dotfiles/hooks/.
# What each machine uses lives in ~/.config/dotfiles/config.yml (not here).
#
#   tool:
#     priority: high        installed before everything else (the only level)
#     gui: true             only works in a graphical session: not installed
#                           or linked on a machine with no graphical interface
#     package:              how to install it
#       all: name           every platform not listed below
#       <platform>: name    or [a, b] (installed together). Without all:,
#                           only the listed platforms get the tool and its
#                           links. aur/<name> under arch: from the AUR (yay)
#       <platform>: ~       used there, nothing to install (part of the OS):
#                           only checks that its command is there
#     command: name         the command that shows it's installed (default:
#                           the tool's name); can also be per platform
#     links:
#       <path>: <dest>      <path> is in config/; <dest> is $HOME/... (or
#                           ~/...), or absolute for system files
#       <path>:
#         <platform>: <dest>    another place per platform (none = not
#                               linked there)
#     clone:
#       owner/repo: <dest>  GitHub; any other host as a full URL
#
#   Platforms: arch, debian, fedora, mac, windows, and linux (all three).
#   No package: = nothing to install anywhere (links only, or a hook
#   installs it).
#
# Worked out from the files, nothing to write:
#   - <dest> outside $HOME (/etc, /usr): a root-owned copy, not a symlink
#   - a copied systemd unit with [Install]: enabled (--now)
#   - a file with op:// references: written filled in from 1Password
#
# Hooks: config/dotfiles/hooks/<tool>.sh runs, when it exists, after the
# tool's package and links (link, update, interactive). A tool with a hook
# is used on every platform (the hook handles the ones package: doesn't
# list), and a tool can be only a hook, with no entry here.
#
# Order: priority: high, then the tools required on this machine
# (config.yml), then the rest; file order within each.

tools:
  1password:
    # The desktop app and the CLI (op), installed together.
    package:
      arch: [1password, 1password-cli]
      mac: [1password, 1password-cli]
      windows: [AgileBits.1Password, AgileBits.1Password.CLI]
    links:
      op/server.json: $HOME/.config/op/server.json

  atuin:
    package:
      mac: atuin
      arch: atuin
      windows: Atuinsh.Atuin
    links:
      atuin: $HOME/.config/atuin

  aerospace:
    package:
      mac: nikitabobko/tap/aerospace
    links:
      aerospace: $HOME/.config/aerospace

  # Packaged in the Omarchy pacman repo. hooks/aether.sh writes the
  # blueprints, settings.json and favorites.json with this machine's paths
  # (and copies Aether's changes back), and elsewhere installs the latest
  # GitHub release.
  aether:
    package:
      arch: aether

  bash:
    package:
      all: bash
      windows: Git.Git   # Git Bash
    links:
      bash/.bashrc: $HOME/.bashrc

  bat:
    package:
      all: bat
      windows: sharkdp.bat
    command:
      debian: batcat
    links:
      bat: $HOME/.config/bat

  btop:
    package:
      all: btop
      windows: aristocratos.btop4win
    links:
      btop: $HOME/.config/btop

  chromium-flags.conf:
    package:
      linux: chromium
    command: chromium
    links:
      chromium-flags.conf: $HOME/.config/chromium-flags.conf

  composer:
    package:
      linux: composer
      mac: composer
    links:
      composer: $HOME/.config/composer

  # Only brew packages cspell: hooks/cspell.sh installs it with npm
  # everywhere else, and its dictionaries everywhere.
  cspell:
    package:
      mac: cspell
    links:
      cspell: $HOME/.config/cspell

  # hooks/espanso.sh makes it start at boot (a service), and installs it on
  # Fedora (Terra repo) and Debian (latest GitHub release), which have no
  # package. A text expander needs a graphical session: gui.
  espanso:
    gui: true
    package:
      arch: aur/espanso-wayland
      mac: espanso
      windows: Espanso.Espanso
    links:
      espanso: $HOME/.config/espanso

  fastfetch:
    package:
      all: fastfetch
      windows: Fastfetch-cli.Fastfetch
    links:
      fastfetch: $HOME/.config/fastfetch

  fd:
    package:
      all: fd
      debian: fd-find
      fedora: fd-find
      windows: sharkdp.fd
    command:
      debian: fdfind
    links:
      fd/ignore: $HOME/.config/fd/ignore

  fontconfig:
    package:
      linux: fontconfig
      mac: fontconfig
    command: fc-list
    links:
      fontconfig: $HOME/.config/fontconfig

  gh:
    package:
      all: gh
      arch: github-cli
      windows: GitHub.cli
    links:
      gh/config.yml: $HOME/.config/gh/config.yml

  ghostty:
    package:
      arch: ghostty
      mac: ghostty
    links:
      ghostty: $HOME/.config/ghostty

  git:
    package:
      all: git
      windows: Git.Git
    links:
      git: $HOME/.config/git

  gitlogue:
    package:
      arch: gitlogue
      mac: gitlogue
    links:
      gitlogue/config.toml: $HOME/.config/gitlogue/config.toml

  go:
    package:
      all: go
      debian: golang-go
      fedora: golang
      windows: GoLang.Go
    links:
      go/env:
        linux: $HOME/.config/go/env
        mac: $HOME/Library/Application Support/go/env
        windows: $HOME/AppData/Roaming/go/env

  gobuster:
    package:
      linux: gobuster
      mac: gobuster
    links:
      gobuster: $HOME/.config/gobuster

  glow:
    package:
      arch: [glow, glow-fish-completion]
      debian: glow
      fedora: glow
      mac: glow
      windows: charmbracelet.glow


  # The interactive screens' checkbox lists (#82); installed first so the
  # first interactive run already has them.
  gum:
    priority: high
    package:
      all: gum
      windows: charmbracelet.gum

  herdr:
    package:
      arch: herdr
      mac: herdr
    links:
      herdr/config.toml: $HOME/.config/herdr/config.toml

  hypr:
    package:
      arch: hyprland
    command: Hyprland
    links:
      hypr: $HOME/.config/hypr

  hyprland-preview-share-picker:
    package:
      arch: hyprland-preview-share-picker
    links:
      hyprland-preview-share-picker: $HOME/.config/hyprland-preview-share-picker

  # The files are komorebi for Mac + skhd, not Windows komorebi (whkd).
  # Kept in the repo for later; leave it off config.yml.
  komorebi:
    package:
      windows: LGUG2Z.komorebi
    links:
      komorebi: $HOME/.config/komorebi

  lazydocker:
    package:
      arch: lazydocker
      mac: lazydocker
      windows: JesseDuffield.Lazydocker
    links:
      lazydocker/config.yml:
        linux: $HOME/.config/lazydocker/config.yml
        mac: $HOME/Library/Application Support/jesseduffield/lazydocker/config.yml
        windows: $HOME/AppData/Roaming/jesseduffield/lazydocker/config.yml

  lazygit:
    package:
      arch: lazygit
      debian: lazygit
      mac: lazygit
      windows: JesseDuffield.lazygit
    links:
      lazygit: $HOME/.config/lazygit

  # The boot menu: Omarchy (boots linux-surface directly) and a collapsed
  # Advanced options (every kernel and the snapshots). 50-omarchy-limine-style
  # reshapes /boot/limine.conf after every kernel or boot update (a boot
  # hook) and after every snapshot (the .path unit: limine-snapper-sync
  # rewrites the file without running boot hooks; it has [Install], so it's
  # enabled). hooks/limine.sh sets TARGET_OS_NAME and BOOT_ORDER in
  # /etc/default/limine and renames the generated menu entry once.
  limine:
    package:
      arch: limine
    links:
      limine/hooks/50-omarchy-limine-style: /etc/boot/hooks/post.d/50-omarchy-limine-style
      limine/system/omarchy-limine-style.service: /etc/systemd/system/omarchy-limine-style.service
      limine/system/omarchy-limine-style.path: /etc/systemd/system/omarchy-limine-style.path

  # Debian and Fedora: hooks/massCode.sh installs the AppImage. massCode
  # loads every .json in ~/.massCode/themes (same path on every OS).
  massCode:
    package:
      arch: aur/masscode
      mac: masscode
      windows: AntonReshetov.massCode
    command: masscode
    links:
      massCode/starburst.json: $HOME/.massCode/themes/starburst.json

  mise:
    priority: high
    package:
      arch: mise-bin
      mac: mise
      windows: jdx.mise
    links:
      mise/config.toml: $HOME/.config/mise/config.toml

  nano:
    package:
      all: nano
      windows: GNU.Nano
    links:
      nano: $HOME/.config/nano

  npm:
    package:
      all: npm
      fedora: nodejs   # brings npm
      mac: node
      windows: OpenJS.NodeJS
    links:
      npm: $HOME/.config/npm

  nvim:
    package:
      all: neovim
      windows: Neovim.Neovim
    links:
      nvim: $HOME/.config/nvim

  obsidian:
    package:
      arch: obsidian
      mac: obsidian
      windows: Obsidian.Obsidian
    links:
      obsidian/user-flags.conf:
        linux: $HOME/.config/obsidian/user-flags.conf

  # System files: copies outside $HOME. The .path unit has [Install], so
  # it's enabled; it starts the .service. surface-boot-theme-apply draws the
  # boot menu wallpaper with ImageMagick in FiraCode Nerd Font: without
  # them it fails and the boot screens keep the stock look. hooks/omarchy.sh
  # runs it once after linking.
  omarchy:
    package:
      arch: [omarchy, imagemagick, ttf-firacode-nerd]
    links:
      omarchy: $HOME/.config/omarchy
      omarchy/system/surface-boot-theme-apply: /usr/local/sbin/surface-boot-theme-apply
      omarchy/system/surface-boot-theme.service: /etc/systemd/system/surface-boot-theme.service
      omarchy/system/surface-boot-theme.path: /etc/systemd/system/surface-boot-theme.path

  ranger:
    package:
      linux: ranger
      mac: ranger
    links:
      ranger: $HOME/.config/ranger

  # Secure Boot the linux-surface way: Microsoft-signed shim in front of
  # Limine, Limine and kernel images signed with our own MOK key. Pick it
  # only on a machine that boots this way (omaSurface). The key never goes
  # in the repo: hooks/secureboot.sh takes it from /etc/secureboot-mok or
  # the 1Password document "Secure Boot MOK", then sets up shim and the
  # firmware boot entry. Arch with Limine + mkinitcpio only for now.
  secureboot:
    package:
      arch: [sbsigntools, mokutil, efibootmgr, aur/shim-signed]
    command: sbsign
    links:
      secureboot/40-shim-limine-sync: /etc/boot/hooks/post.d/40-shim-limine-sync
      secureboot/mok-sign: /etc/initcpio/post/mok-sign
      secureboot/99-shim-limine-sync.hook: /etc/pacman.d/hooks/99-shim-limine-sync.hook

  # macOS and Windows come with OpenSSH. ssh/config has op:// references:
  # written filled in from 1Password.
  ssh:
    package:
      arch: openssh
      debian: openssh-client
      fedora: openssh-clients
      mac: ~
      windows: ~
    links:
      ssh/config: $HOME/.ssh/config

  starship:
    package:
      arch: starship
      debian: starship
      mac: starship
      windows: Starship.Starship
    links:
      starship: $HOME/.config/starship

  # Debian and Fedora: hooks/superfile.sh runs superfile's installer.
  superfile:
    package:
      arch: superfile
      mac: superfile
      windows: yorukot.superfile
    command: spf
    links:
      superfile: $HOME/.config/superfile

  thefuck:
    package:
      linux: thefuck
      mac: thefuck
    links:
      thefuck: $HOME/.config/thefuck

  tmux:
    package:
      linux: tmux
      mac: tmux
    links:
      tmux: $HOME/.config/tmux

  top:
    package:
      arch: procps-ng
      debian: procps
      fedora: procps-ng
    links:
      top/toprc: $HOME/.config/procps/toprc

  vim:
    package:
      all: vim
      fedora: vim-enhanced
      windows: vim.vim
    links:
      vim: $HOME/.config/vim

  # Stable and Insiders, installed together (Insiders is the main one: the
  # code alias opens it). No links: settings, snippets and extensions come
  # from VS Code Settings Sync (sign in, then Backup and Sync Settings).
  vscode:
    package:
      arch: [visual-studio-code-bin, aur/visual-studio-code-insiders-bin]
      mac: [visual-studio-code, visual-studio-code@insiders]
      windows: [Microsoft.VisualStudioCode, Microsoft.VisualStudioCode.Insiders]
    command: code

  # Debian and Fedora: hooks/warp.sh adds Warp's apt or dnf repo and
  # installs it from there.
  warp:
    package:
      arch: aur/warp-terminal-bin
      mac: warp
      windows: Warp.Warp
    command: warp-terminal
    links:
      warp/starburst.yml:
        mac: $HOME/.warp/themes/starburst.yml
        linux: $HOME/.local/share/warp-terminal/themes/starburst.yml
        windows: $HOME/AppData/Roaming/warp/Warp/data/themes/starburst.yml

  wezterm:
    package:
      arch: wezterm
      mac: wezterm
      windows: wez.wezterm
    links:
      wezterm: $HOME/.config/wezterm

  xdg-ninja:
    package:
      arch: xdg-ninja
      mac: xdg-ninja

  xdg-terminals.list:
    package:
      linux: xdg-terminal-exec
    command: xdg-terminal-exec
    links:
      xdg-terminals.list: $HOME/.config/xdg-terminals.list

  yay:
    priority: high
    package:
      arch: yay
    links:
      yay/config.json: $HOME/.config/yay/config.json

  yazi:
    package:
      arch: yazi
      mac: yazi
      windows: sxyazi.yazi
    links:
      yazi: $HOME/.config/yazi

  zsh:
    package:
      linux: zsh
      mac: zsh
    links:
      zsh: $HOME/.config/zsh
    clone:
      ohmyzsh/ohmyzsh: $HOME/.config/zsh/oh-my-zsh
      zsh-users/zsh-autosuggestions: $HOME/.config/zsh/oh-my-zsh/custom/plugins/zsh-autosuggestions
      zsh-users/zsh-completions: $HOME/.config/zsh/oh-my-zsh/custom/plugins/zsh-completions
      zsh-users/zsh-syntax-highlighting: $HOME/.config/zsh/oh-my-zsh/custom/plugins/zsh-syntax-highlighting
