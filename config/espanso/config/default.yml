# Espanso Configuration File

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# ----- OPTIONS --------
# toggle_key: OFF
# auto_restart: false
# backend: Clipboard
# clipboard_threshold: 100
search_shortcut: off
search_trigger: off
show_icon: false
show_notifications: false

# Wayland can't tell espanso the layout (it warns on every start and can
# type wrong characters). macOS and Windows ignore this.
keyboard_layout:
  layout: us

# The private snippets, filled from 1Password by dotfiles' espanso hook,
# outside the repo. espanso doesn't expand ~ or $HOME here: Linux, then
# macOS (the one that doesn't exist is skipped).
extra_includes:
  - /home/*/.local/share/espanso/private.yml
  - /Users/*/.local/share/espanso/private.yml
