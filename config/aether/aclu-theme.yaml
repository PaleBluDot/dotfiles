scheme: "ACLU Brand"
author: "Pavel"
base00: "1c1c1e" # default background (neutral dark)
base01: "2c2c2e" # lighter background (status bar / line highlight)
base02: "001e3d" # selection background (blue-tinted — swap to "2c2c2e" for plain)
base03: "888888" # comments / invisibles
base04: "696968" # dark foreground (status bar text)
base05: "f3f3f3" # default foreground (main text)
base06: "f7f9fd" # light foreground
base07: "ffffff" # lightest background
base08: "d9192b" # variables / errors — red.primary
base09: "ff7d00" # constants / numbers — orange.primary
base0A: "fdc221" # classes / markup — yellow.primary
base0B: "499764" # strings — green.primary
base0C: "6cffff" # support / regex — neon.blue
base0D: "146cd2" # functions / methods — blue.primary
base0E: "862dcb" # keywords — purple.primary
base0F: "3e020e" # deprecated — red.dark
