mode = "dark"

# Starburst — from the Starburst Dark VS Code theme
# (github.com/PaleBluDot/starburst-theme, psanchez.starburst-theme).
# dark_background, darker_background and selection are derived (the editor
# background is already near black; selection = foreground at 24%, as in VS Code).
