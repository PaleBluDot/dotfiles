name: Release

# Releases only from main: on every push to it, or by hand from the Actions
# tab (Run workflow), which is also how a failed release is retried. Tests
# ran on the pull request (Dry Release), so this only builds and publishes.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release at a time: a merge right after another waits for it.
concurrency:
  group: release
  cancel-in-progress: false

# Tag and release (contents), comment on released issues and PRs.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  Release:
    name: 🚀 Release 🚀
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # The deploy key (secret RELEASE_DEPLOY_KEY, write access) is on main's
      # bypass list, so semantic-release can push the release commit and tag
      # to main, which admins can only reach through a pull request. Kept for
      # the release step's git push (persist-credentials).
      - name: 🛒 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: 📥 Install deps
        run: npm install

      # npm publish ships the built files, so they're built here.
      - name: 🏗 Build
        run: npm run build --if-present

      # Pushes over SSH with the deploy key from the checkout. GH_TOKEN is
      # only for the GitHub API (the release, comments on issues and PRs).
      - name: 🚀 Release
        run: npm run release -- --repository-url git@github.com:PaleBluDot/dotfiles.git
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.GIT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_EMAIL }}
